services:
  # ----------------------------------------------------
  # INFRASTRUCTURE DATABASES & BROKERS
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: eco_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: eco_mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./init-scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eco_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: eco_kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  # ----------------------------------------------------
  # 5 MICROSERVICES (DDD & Database-per-Service)
  # ----------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: eco_auth_service
    environment:
      - PORT=50051
      - DB_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/auth_db
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - AUTH_PROTO_PATH=/shared/proto/auth.proto
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: eco_customer_service
    environment:
      - PORT=50052
      - DB_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/customer_db
      - CUSTOMER_PROTO_PATH=/shared/proto/customer.proto
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: eco_product_service
    environment:
      - PORT=50053
      - MONGO_URI=mongodb://mongodb:27017/product_db
      - PRODUCT_PROTO_PATH=/shared/proto/product.proto
    ports:
      - "50053:50053"
    depends_on:
      mongodb:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: eco_order_service
    environment:
      - PORT=50054
      - DB_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/order_db
      - CUSTOMER_GRPC_HOST=customer-service:50052
      - PRODUCT_GRPC_HOST=product-service:50053
      - KAFKA_BROKERS=kafka:9092
      - ORDER_PROTO_PATH=/shared/proto/order.proto
      - CUSTOMER_PROTO_PATH=/shared/proto/customer.proto
      - PRODUCT_PROTO_PATH=/shared/proto/product.proto
    ports:
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  shipment-service:
    build:
      context: .
      dockerfile: services/shipment-service/Dockerfile
    container_name: eco_shipment_service
    environment:
      - PORT=50055
      - MONGO_URI=mongodb://mongodb:27017/shipment_db
      - KAFKA_BROKERS=kafka:9092
      - SHIPMENT_PROTO_PATH=/shared/proto/shipment.proto
    ports:
      - "50055:50055"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started

  # ----------------------------------------------------
  # API GATEWAY (Routing, JWT, Rate Limiting, Redis)
  # ----------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: eco_api_gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - AUTH_GRPC_HOST=auth-service:50051
      - CUSTOMER_GRPC_HOST=customer-service:50052
      - PRODUCT_GRPC_HOST=product-service:50053
      - ORDER_GRPC_HOST=order-service:50054
      - SHIPMENT_GRPC_HOST=shipment-service:50055
      - AUTH_PROTO_PATH=/shared/proto/auth.proto
      - CUSTOMER_PROTO_PATH=/shared/proto/customer.proto
      - PRODUCT_PROTO_PATH=/shared/proto/product.proto
      - ORDER_PROTO_PATH=/shared/proto/order.proto
      - SHIPMENT_PROTO_PATH=/shared/proto/shipment.proto
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      shipment-service:
        condition: service_started
