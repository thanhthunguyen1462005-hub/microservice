syntax = "proto3";

package shipment;

service ShipmentService {
  rpc GetShipmentById (GetShipmentRequest) returns (ShipmentResponse);
  rpc UpdateShipmentStatus (UpdateStatusRequest) returns (ShipmentResponse);
}

message GetShipmentRequest {
  int32 shipid = 1;
}

message UpdateStatusRequest {
  int32 shipid = 1;
  string status = 2;
}

message ShipmentResponse {
  int32 shipid = 1;
  int32 oid = 2;
  string status = 3;
}
